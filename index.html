<!-- index.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
      <!-- R Favicon-->
      <link rel="apple-touch-icon" sizes="180x180" href="https://remeil.co.nz/apple-touch-icon.png">
      <link rel="icon" type="image/png" sizes="32x32" href="https://remeil.co.nz/favicon-32x32.png">
      <link rel="icon" type="image/png" sizes="16x16" href="https://remeil.co.nz/favicon-16x16.png">

      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <!-- Font Awesome Icons -->
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
      <!-- Nunito Fonts -->
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">

      <!-- Rem's Stylesheets-->
      <link rel="stylesheet" href="https://css.remeil.co.nz/rem.css">
      <link rel="stylesheet" href="tcg.css">
    <title>Remeil's Baseline Card tracker</title>
  </head>
  <body class="bg-seashell">
    <div class="container">
        <div class="row gradient-red shadow-subtle mb1 p05 font-white">
            <div class="col-sm-1 center">
              <div class="dropdown">
                <h1><i class="fa-solid fa-bars"></i></h1>
                <div class="dropdown-content br05 border-sage bg-white font-black p1 shadow-subtle">
                  <ul class="list-style-none">
                    <h4>Set Changes</h4>
                    <li>Add set to database</li>
                    <li>Edit an existing set</li>
                    <hr class="m05">
                    <h4>Card Changes</h4>
                    <li>Add card to database</li>
                    <li>Edit an existing card</li>
                    <li>Update card price information</li>
                    <hr class="m05">
                    <h4>My Account</h4>
                    <li id="nav-login" style="cursor: pointer;">Login</li>
                    <li id="nav-logout" style="cursor: pointer; display: none;">Logout</li>
                    <li>Register</li>
                    <li id="nav-my-cards" style="cursor: pointer;">My Cards</li>
                  </ul>
                </div>
              </div>
            </div>
            <div class="col-sm-10 center">
                <h1>Rem's Baseline Card Tracker</h1>
            </div>
            <div class="col-sm-1 center"><h1><i class="fa-solid fa-magnifying-glass"></i></h1></div>
        </div>

        <div id="cards-container"></div>

        <!-- Modal target by ID, hidden by default -->
        <div id="login-modal" class="modal-overlay bg-charcoal-transparent" style="display: none;">
          <div class="bg-white modal p1 m1 br05 row" style="width:600px; position: relative;">
            <div class="col-sm-12">
              <span id="close-modal" style="position: absolute; top: 10px; right: 15px; cursor: pointer; font-weight: bold;">✕</span>
              <h1 class="center">Login</h1>

              <div id="login-error" style="color: red; display: none;" class="mb1 center"></div>

              <form id="login-form" class="large-inputs form">
                <label for="uname">Username: </label>
                <input type="text" id="uname" name="uname" required>
                <label for="pword">Password: </label>
                <input type="password" id="pword" name="pword" required>
                <button class="btn" type="submit">Submit</button>
              </form>
            </div>
          </div>
        </div>

    </div>
</body>
<script src="auth.js"></script>
<script src="load-cards.js"></script>
</html>
